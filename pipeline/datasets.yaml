# Every corpus the emotion model can use. Sources verified 2026-10-10 (headers / file
# listings only; nothing was downloaded on the dev server). Sizes are download sizes.
#
# access: open      -> fetched by scripts/downloads/ (bash pipeline/run.sh download)
#         licensed  -> request access (see NEXT_STEPS.md), place under <data root>/raw/<name>/,
#                      then `bash pipeline/run.sh prepare` picks it up automatically

ravdess:
  access: open
  source: https://zenodo.org/records/1188976 (Audio_Speech_Actors_01-24.zip)
  size: 208 MB
  clips: 1440
  speakers: 24 actors (12 F, 12 M)
  speech: acted, 2 fixed sentences, North American English
  emotions: neutral, calm (-> neutral), happy, sad, angry, fearful (-> fear), disgust, surprised (-> surprise)
  transcripts: the 2 sentences (lexically neutral by design)
  dimensions: no
  split: actors 1-18 train, 19-20 val, 21-24 test
  license: CC BY-NC-SA 4.0
  cite: Livingstone & Russo (2018), PLoS ONE 13(5)
  status: script ready

crema_d:
  access: open
  source: https://github.com/CheyneyComputerScience/CREMA-D (Git LFS; Kaggle mirror ejlok1/cremad as fallback)
  size: ~600 MB
  clips: 7442
  speakers: 91 actors (48 M, 43 F), diverse age and ethnicity
  speech: acted, 12 fixed sentences
  emotions: neutral, happy, sad, angry, fear, disgust (no surprise)
  labels: acted (default) or crowd voice-only vote (--crema-label voice_vote)
  transcripts: the 12 sentences
  dimensions: no
  split: actors 70/15/15 within each sex, fixed seed
  license: Open Database License (ODbL)
  cite: Cao et al. (2014), IEEE Trans. Affective Computing 5(4)
  status: script ready

tess:
  access: open
  source: https://borealisdata.ca/dataset.xhtml?persistentId=doi:10.5683/SP2/E8H2MF
  size: 281 MB
  clips: 2800
  speakers: 2 (women aged 26 and 64)
  speech: "Say the word ___" with 200 target words
  emotions: neutral, happy, sad, angry, fear, disgust, pleasant surprise (-> surprise)
  dimensions: no
  split: training only (2 speakers cannot give a speaker-independent test)
  license: CC BY-NC 4.0
  cite: Dupuis & Pichora-Fuller (2010), University of Toronto
  status: script ready

meld:
  access: open
  source: https://huggingface.co/datasets/declare-lab/MELD (MELD.Raw.tar.gz)
  size: 10.9 GB (video; audio is extracted to ~1.5 GB of FLAC)
  clips: ~13700 utterances
  speakers: TV characters (Friends); recur across the official splits
  speech: natural-ish conversational dialogue, laughter track, overlapping speech
  emotions: neutral, joy (-> happy), sadness (-> sad), anger (-> angry), fear, disgust, surprise
  transcripts: yes (real, varied) -- the corpus where the text tower can learn
  dimensions: no (sentiment only, unused)
  split: official train / dev / test
  license: GPL-3.0
  cite: Poria et al. (2019), ACL
  status: script ready

esd:
  access: public link, but use only after a signed, dated licence PDF is returned to haizhou.li@nus.edu.sg (clause 5); internal non-commercial research; derived models must be shared with the licensor (clause 6)
  source: https://github.com/HLTSingapore/Emotional-Speech-Data (Google Drive file 1scuFwqh8s7KIYAfZW1Eu6088ZAK2SI-v)
  size: whole archive (English + Mandarin) not stated; English half ~17,500 clips
  clips: 17500 English (10 speakers x 350 parallel sentences x 5 emotions); the 10 Mandarin speakers are dropped
  speakers: 10 native English speakers (0011-0020)
  speech: acted, parallel sentences (same text in every emotion, so text carries no emotion)
  emotions: neutral, happy, angry, sad, surprise
  transcripts: yes (lexically neutral)
  dimensions: no
  split: speakers 0011-0018 train, 0019 val, 0020 test (the corpus's own split is by sentence, not speaker)
  license: NUS HLT End User License Agreement (signed; non-commercial; copyleft clause 6; acknowledgement clause 10)
  cite: Zhou, Sisman, Liu & Li (2021), ICASSP; Zhou et al. (2022), Speech Communication 137
  status: script ready (opt-in --esd), layout not yet seen on real files

iemocap:
  access: licensed (free for academic research; release form at https://sail.usc.edu/iemocap/)
  size: ~12 GB
  clips: 10039 turns, ~12 h
  speakers: 10 actors in 5 dyadic sessions
  speech: scripted and improvised dyadic conversation
  emotions: neutral, happy + excited (-> happy), sad, angry (standard 4-class protocol)
  transcripts: yes
  dimensions: valence, activation (arousal), dominance on 1-5 -> scaled 0..1
  split: sessions 1-3 train, 4 val, 5 test (leave-one-session-out)
  place at: <data root>/raw/iemocap/IEMOCAP_full_release/Session1..5
  cite: Busso et al. (2008), Language Resources and Evaluation 42(4)
  status: parser ready, needs the licence

msp_podcast:
  access: licensed (academic licence from UT Dallas MSP lab: https://ecs.utdallas.edu/research/researchlabs/msp-lab/MSP-Podcast.html)
  size: ~100+ GB depending on release
  clips: 150k+ segments, 200+ h (release 1.11/1.12)
  speakers: 1,000+ podcast speakers
  speech: natural, spontaneous -- the closest public match to one person talking at a desk
  emotions: neutral, happy, sad, angry, fear, disgust, surprise (contempt / other / no agreement dropped)
  transcripts: yes (release-provided)
  dimensions: arousal, valence, dominance on 1-7 -> scaled 0..1
  split: official Train / Development / Test1
  place at: <data root>/raw/msp_podcast/{Audios, Labels/labels_consensus.csv, Transcripts}
  cite: Lotfian & Busso (2019), IEEE Trans. Affective Computing 10(4)
  status: parser ready, needs the licence

pretrained_models:
  microsoft/wavlm-base-plus: {size: 378 MB, use: default audio encoder (95 M parameters)}
  j-hartmann/emotion-english-distilroberta-base: {size: 329 MB, use: text tower initialisation}
  facebook/hubert-base-ls960: {size: 378 MB, use: E6 encoder comparison, license apache-2.0}
  facebook/wav2vec2-base: {size: 380 MB, use: E7 encoder comparison, license apache-2.0}
  microsoft/wavlm-large: {size: 1262 MB, use: E8 upper bound / teacher (316 M parameters)}
