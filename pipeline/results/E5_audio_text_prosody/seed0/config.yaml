seed: 0
data:
  manifest: manifests/manifest.csv
  prosody_table: features/prosody.parquet
  train_datasets: auto
  heldout_datasets: []
  max_train_seconds: 6.0
  max_eval_seconds: 12.0
  max_text_tokens: 64
  augment: true
  augmentation:
    noise_snr_db:
    - 10
    - 30
    gain_db:
    - -6
    - 6
    p_noise: 0.3
  sampler: dataset_class
  sampler_power: 0.5
  num_workers: 6
model:
  embed_dim: 256
  dropout: 0.2
  modality_dropout: 0.2
  audio:
    enabled: true
    encoder: microsoft/wavlm-base-plus
    finetune_layers: 4
    spec_augment: true
  text:
    enabled: true
    encoder: j-hartmann/emotion-english-distilroberta-base
    finetune_layers: 2
  prosody:
    enabled: true
    hidden: 128
train:
  epochs: 20
  batch_size: 16
  grad_accum: 2
  eval_batch_size: 16
  lr_head: 0.001
  lr_encoder: 2.0e-05
  weight_decay: 0.01
  warmup_ratio: 0.05
  grad_clip: 1.0
  precision: bf16
  label_smoothing: 0.1
  class_weight_power: 0.5
  dim_loss_weight: 0.5
  patience: 5
  selection_metric: mean_dataset_ua
  log_every: 25
  keep_last_checkpoint: false
  max_steps: 0
  limit_per_split: 0
inference:
  classes:
  - neutral
  - happy
  - sad
  - angry
  - fear
  - disgust
  - surprise
experiment: E5_audio_text_prosody
